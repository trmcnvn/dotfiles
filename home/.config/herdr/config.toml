onboarding = false

[terminal]
default_shell = "nu"
shell_mode = "login"
new_cwd = "follow"

[update]
channel = "stable"
version_check = true
manifest_check = true

[keys]
prefix = "ctrl+semicolon"

[[keys.command]]
key = "ctrl+left"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "Navigate left (Vim/Herdr)"

[[keys.command]]
key = "ctrl+down"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "Navigate down (Vim/Herdr)"

[[keys.command]]
key = "ctrl+up"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "Navigate up (Vim/Herdr)"

[[keys.command]]
key = "ctrl+right"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "Navigate right (Vim/Herdr)"

[ui]
sidebar_width = 32
sidebar_min_width = 18
sidebar_max_width = 36
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = false
status_indicators = "symbols"
prompt_new_workspace_name = true
prompt_new_tab_name = true

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "top-right"

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

[ui.sound]
enabled = false

[session]
resume_agents_on_restore = true

[remote]
manage_ssh_config = true

[experimental]
pane_history = true
allow_nested = false
kitty_graphics = true

[advanced]
scrollback_limit_bytes = 52428800

[theme]
name = "rose-pine"
auto_switch = false
