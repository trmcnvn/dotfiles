[tools]
# Default runtimes; projects can override these.
ruby = "4.0"
rust = "stable"
go = "1.27"
node = "latest"
bun = "latest"

# Personal CLI tools.
fnox = "latest"
bitwarden = "latest"
vp = "latest"
aube = "latest"
pitchfork = "latest"

[settings]
always_keep_download = false
always_keep_install = false
plugin_autoupdate_last_check_duration = "1 week"
not_found_auto_install = true
experimental = true
idiomatic_version_file_enable_tools = ["ruby"]

[settings.python]
compile = true

[settings.ruby]
compile = false

[settings.history]
sync = "sync"

[bootstrap.services.mise-history]
builtin = "history-watch"

